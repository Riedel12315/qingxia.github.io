<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试鼠标星星效果</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        
        .container {
            max-width: 800px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #3498db, #9b59b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        p {
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        
        .controls {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 12px 24px;
            font-size: 1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        #btnFull {
            background: linear-gradient(45deg, #3498db, #2980b9);
            color: white;
        }
        
        #btnLight {
            background: linear-gradient(45deg, #2ecc71, #27ae60);
            color: white;
        }
        
        #btnStop {
            background: linear-gradient(45deg, #e74c3c, #c0392b);
            color: white;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        
        .instructions {
            margin-top: 40px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            text-align: left;
        }
        
        .instructions h3 {
            margin-top: 0;
            color: #3498db;
        }
        
        .instructions ul {
            padding-left: 20px;
        }
        
        .instructions li {
            margin-bottom: 10px;
        }
        
        .status {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
        }
        
        .active {
            background: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
            border: 1px solid #2ecc71;
        }
        
        .inactive {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
            border: 1px solid #e74c3c;
        }
        
        .demo-text {
            font-size: 1.5em;
            margin: 40px 0;
            padding: 20px;
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ 鼠标星星效果测试</h1>
        
        <p>移动鼠标查看星星跟随效果！测试不同的版本，选择你喜欢的效果。</p>
        
        <div class="demo-text">
            🎯 在这里移动鼠标试试看！<br>
            ⭐ 星星会跟随你的光标移动<br>
            🌈 有多种颜色和大小变化
        </div>
        
        <div class="controls">
            <button id="btnFull">完整效果</button>
            <button id="btnLight">轻量效果</button>
            <button id="btnStop">停止效果</button>
        </div>
        
        <div id="status" class="status inactive">当前状态: 未启用</div>
        
        <div class="instructions">
            <h3>使用说明：</h3>
            <ul>
                <li><strong>完整效果</strong>：包含闪烁、颜色变化、轨迹效果（效果更丰富）</li>
                <li><strong>轻量效果</strong>：更简单的实现，性能更好（推荐）</li>
                <li><strong>停止效果</strong>：关闭所有星星效果</li>
                <li>选择你喜欢的效果后，我会将其应用到你的网站</li>
                <li>效果只会添加视觉装饰，不会影响网站内容和功能</li>
            </ul>
        </div>
    </div>

    <script>
        // 状态管理
        let currentEffect = null;
        const statusEl = document.getElementById('status');
        
        // 更新状态显示
        function updateStatus(effect) {
            currentEffect = effect;
            if (effect) {
                statusEl.textContent = `当前状态: ${effect} 效果已启用`;
                statusEl.className = 'status active';
            } else {
                statusEl.textContent = '当前状态: 未启用';
                statusEl.className = 'status inactive';
            }
        }
        
        // 清理现有效果
        function cleanupEffects() {
            if (window.cleanupMouseStars) {
                window.cleanupMouseStars();
            }
            if (window.cleanupMouseStarsLight) {
                window.cleanupMouseStarsLight();
            }
            updateStatus(null);
        }
        
        // 加载完整效果
        function loadFullEffect() {
            cleanupEffects();
            
            // 动态加载完整效果脚本
            const script = document.createElement('script');
            script.src = 'assets/js/mouse-stars.js';
            script.onload = function() {
                console.log('完整效果已加载');
                updateStatus('完整');
            };
            document.head.appendChild(script);
        }
        
        // 加载轻量效果
        function loadLightEffect() {
            cleanupEffects();
            
            // 动态加载轻量效果脚本
            const script = document.createElement('script');
            script.src = 'assets/js/mouse-stars-light.js';
            script.onload = function() {
                console.log('轻量效果已加载');
                updateStatus('轻量');
            };
            document.head.appendChild(script);
        }
        
        // 按钮事件
        document.getElementById('btnFull').addEventListener('click', loadFullEffect);
        document.getElementById('btnLight').addEventListener('click', loadLightEffect);
        document.getElementById('btnStop').addEventListener('click', cleanupEffects);
        
        // 初始加载轻量效果（推荐）
        setTimeout(() => {
            loadLightEffect();
        }, 1000);
        
        console.log('测试页面已加载。移动鼠标查看效果！');
    </script>
</body>
</html>
