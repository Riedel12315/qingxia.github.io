{% include base_path %}

<!-- start custom head snippets -->

<!-- One web font only: Inter variable 400–700. Chinese uses the system stack. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- favicon — only assets that actually exist in images/ (no 404).
     Both links point at the same real tile icon; no generated icon plugin. -->
<link rel="icon" type="image/png" sizes="144x144" href="{{ base_path }}/images/mstile-144x144.png">
<link rel="apple-touch-icon" href="{{ base_path }}/images/mstile-144x144.png">
<link rel="mask-icon" href="{{ base_path }}/images/safari-pinned-tab.svg?v=M44lzPylqQ" color="#14566B">
<meta name="msapplication-TileColor" content="#14566B">
<meta name="theme-color" content="#FAF9F6">
<meta name="color-scheme" content="light">

<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- MathJax loaded only on pages that actually contain '$' math delimiters -->
{% assign has_math = false %}
{% if page.content contains '$' %}{% assign has_math = true %}{% endif %}
{% if content contains '$' %}{% assign has_math = true %}{% endif %}
{% if has_math %}
<script type="text/x-mathjax-config">
  MathJax.Hub.Config({
    TeX: { equationNumbers: { autoNumber: "all" } },
    tex2jax: { inlineMath: [ ['$','$'], ["\\(","\\)"] ], processEscapes: true }
  });
</script>
<script src='https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/latest.js?config=TeX-MML-AM_CHTML' async></script>
{% endif %}

<!-- end custom head snippets -->
